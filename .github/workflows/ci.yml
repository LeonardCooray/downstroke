name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    # macOS 27 runner: the package targets macOS 27, which macos-26 can't run.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcode-select -p
          xcrun --find swift
          swift --version

      - name: Test
        run: scripts/test.sh

      - name: Build app (release, ad-hoc signed)
        run: scripts/bundle.sh

      - name: Verify signature
        run: codesign --verify --strict build/Downstroke.app

      # Self-tests and --bench need a window server, Input Monitoring and real audio, so they stay local.
